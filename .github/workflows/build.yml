name: Build S20+ NetHunter Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make zip python-is-python3 libelf-dev libncurses6 libtinfo6 binutils-aarch64-linux-gnu
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 2>/dev/null || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Prepare toolchain permissions and binutils links
        run: |
          chmod -R 755 toolchain/
          chmod +x build_kernel.sh
          GCC_DIR="$(pwd)/toolchain/gcc-cfp/gcc-cfp-jopp-only/aarch64-linux-android-4.9"
          for tool in as ld ar nm objcopy objdump strip readelf elfedit ranlib addr2line; do
            ln -sf "aarch64-linux-android-$tool" "$GCC_DIR/bin/aarch64-linux-gnu-$tool"
          done
          ln -sfn aarch64-linux-android "$GCC_DIR/aarch64-linux-gnu"

      - name: Enable RT3573 / AE3000 & Wi-Fi drivers in defconfig
        run: |
          DEFCONFIG="arch/arm64/configs/exynos9830-z3sxxx_defconfig"
          sed -i 's/# CONFIG_MAC80211 is not set/CONFIG_MAC80211=y/' "$DEFCONFIG"
          sed -i 's/CONFIG_RTL8821AE=y/# CONFIG_RTL8821AE is not set/' "$DEFCONFIG"
          cat << 'CONF' >> "$DEFCONFIG"
          CONFIG_MAC80211_RC_MINSTREL=y
          CONFIG_MAC80211_RC_MINSTREL_HT=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_RT2X00=y
          CONFIG_RT2X00_LIB=y
          CONFIG_RT2X00_LIB_USB=y
          CONFIG_RT2X00_LIB_FIRMWARE=y
          CONFIG_RT2X00_LIB_CRYPTO=y
          CONFIG_RT2800_LIB=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          CONFIG_RT2500USB=y
          CONFIG_RT73USB=y
          CONFIG_ATH9K_HTC=y
          CONF

      - name: Patch AnyKernel3 for S20+
        run: |
          cd arch/arm64/boot
          unzip Nethunter-s20ultra.zip anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -u Nethunter-s20ultra.zip anykernel.sh
          rm anykernel.sh
          cd ../../..

      - name: Build Kernel Image
        run: |
          set -e
          SRCDIR="$(pwd)"
          GCC_DIR="$SRCDIR/toolchain/gcc-cfp/gcc-cfp-jopp-only/aarch64-linux-android-4.9"
          export ARCH=arm64
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          export SEC_BUILD_CONF_VENDOR_BUILD_OS=13
          export CROSS_COMPILE="$GCC_DIR/bin/aarch64-linux-android-"
          export PATH="$SRCDIR/toolchain/clang/host/linux-x86/clang-r349610-jopp/bin:$GCC_DIR/bin:$PATH"
          CC_BIN="$SRCDIR/toolchain/clang/host/linux-x86/clang-r349610-jopp/bin/clang"

          MAKE_ARGS=(
            ARCH=arm64
            CC="$CC_BIN"
            CROSS_COMPILE="$CROSS_COMPILE"
            GCC_TOOLCHAIN_DIR="$GCC_DIR/bin/"
            GCC_TOOLCHAIN="$GCC_DIR"
          )

          make "${MAKE_ARGS[@]}" exynos9830-z3sxxx_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig
          make "${MAKE_ARGS[@]}" syncconfig < /dev/null

          echo "=== Verification des pilotes actives dans .config ==="
          grep -E "CONFIG_MAC80211=|CONFIG_RT2800USB=|CONFIG_RT2800USB_RT3573=|CONFIG_88XXAU=|RTL8821AE" .config || true

          make -j$(nproc) "${MAKE_ARGS[@]}" KCFLAGS="-w -Wno-gnu-variable-sized-type-not-at-end" < /dev/null

          test -f arch/arm64/boot/Image
          cp arch/arm64/boot/Image Image
          zip arch/arm64/boot/Nethunter-s20ultra.zip Image

      - name: Package S20+ Zip
        run: |
          cp arch/arm64/boot/Nethunter-s20ultra.zip Nethunter-s20plus-ae3000.zip

      - name: Upload Finished Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Nethunter-s20plus-ae3000
          path: Nethunter-s20plus-ae3000.zip
